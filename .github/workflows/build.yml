# Builds DeskPet for Windows and macOS on every push. Pushing a tag like v0.2.0 also publishes a
# GitHub Release with both downloads under fixed names, so the README's
# ".../releases/latest/download/<file>" links always point at the newest version.
name: Build

on:
  push:
    branches: [main]
    tags: ["v*"]
  pull_request:
  workflow_dispatch:

permissions:
  contents: write

jobs:
  windows:
    runs-on: windows-latest
    defaults:
      run:
        shell: bash
        working-directory: windows/src-tauri
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
      - uses: Swatinem/rust-cache@v2
        with:
          workspaces: windows/src-tauri
      - name: Install Tauri CLI
        run: cargo install tauri-cli --version "^2" --locked
      - name: Build installer
        run: |
          # On a release tag, stamp its version (v1.2.3 -> 1.2.3) into the app.
          if [[ "$GITHUB_REF" == refs/tags/v* ]]; then
            cargo tauri build --config "{\"version\": \"${GITHUB_REF_NAME#v}\"}"
          else
            cargo tauri build
          fi
          cp target/release/bundle/nsis/*-setup.exe "$GITHUB_WORKSPACE/DeskPet-Windows-setup.exe"
      - uses: actions/upload-artifact@v4
        with:
          name: DeskPet-Windows
          path: DeskPet-Windows-setup.exe

  macos:
    runs-on: macos-latest   # Apple Silicon
    steps:
      - uses: actions/checkout@v4
      - name: Build DeskPet.app
        working-directory: mac
        run: |
          if [[ "$GITHUB_REF" == refs/tags/v* ]]; then export VERSION="${GITHUB_REF_NAME#v}"; fi
          BUILD_NUMBER="$GITHUB_RUN_NUMBER" ./build_app.sh
          # ditto keeps the bundle's attributes and signature intact.
          ditto -c -k --keepParent DeskPet.app "$GITHUB_WORKSPACE/DeskPet-macOS.zip"
      - uses: actions/upload-artifact@v4
        with:
          name: DeskPet-macOS
          path: DeskPet-macOS.zip

  release:
    if: startsWith(github.ref, 'refs/tags/v')
    needs: [windows, macos]
    runs-on: ubuntu-latest
    steps:
      - uses: actions/download-artifact@v4
        with:
          merge-multiple: true
      - name: Publish release
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          gh release create "$GITHUB_REF_NAME" DeskPet-Windows-setup.exe DeskPet-macOS.zip \
            --repo "$GITHUB_REPOSITORY" --title "DeskPet $GITHUB_REF_NAME" --generate-notes
