# Builds the Windows installer (DeskPet_x.y.z_x64-setup.exe) and attaches it to the run as an artifact.
name: Windows build

on:
  workflow_dispatch:
  push:
    paths:
      - "windows/**"
      - "assets/**"
      - ".github/workflows/windows.yml"

jobs:
  build:
    runs-on: windows-latest
    defaults:
      run:
        working-directory: windows/src-tauri
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
      - uses: Swatinem/rust-cache@v2
        with:
          workspaces: windows/src-tauri
      - name: Install Tauri CLI
        run: cargo install tauri-cli --version "^2" --locked
      - name: Build installer
        run: cargo tauri build
      - uses: actions/upload-artifact@v4
        with:
          name: DeskPet-windows
          path: windows/src-tauri/target/release/bundle/nsis/*.exe
