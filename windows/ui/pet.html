<!doctype html>
<html>
<head>
  <meta charset="utf-8">
  <title>DeskPet</title>
  <link rel="stylesheet" href="pet.css">
</head>
<body>
  <div id="stage">
    <div id="bubble" class="bubble"></div>
    <img id="cloud" alt="">
    <div id="cloud-fallback"></div>
    <svg id="bolts" width="280" height="420"></svg>
    <img id="thrower" alt="">

    <div id="hit">
      <div id="hp">
        <span class="tag">HP</span>
        <div class="track"><div class="fill"></div><div class="hatch"></div></div>
        <span class="value"></span>
      </div>
      <div id="body">
        <div id="shadow"></div>
        <div id="breathe">
          <img id="sprite" alt="">
          <div id="placeholder">🐣</div>
        </div>
      </div>
    </div>

    <div id="fx"></div>
  </div>
  <script type="module" src="pet.js"></script>
</body>
</html>
