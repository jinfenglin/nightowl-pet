[package]
name = "deskpet"
version = "0.1.0"
description = "A desktop pet that keeps you disciplined"
edition = "2021"

[build-dependencies]
tauri-build = { version = "2", features = [] }

[dependencies]
tauri = { version = "2", features = ["tray-icon", "image-png", "protocol-asset", "macos-private-api"] }
tauri-plugin-autostart = "2"
tauri-plugin-dialog = "2"
tauri-plugin-opener = "2"
tauri-plugin-single-instance = "2"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
chrono = "0.4"
user-idle = "0.6"
sys-locale = "0.3"
trash = "5"
rand = "0.8"
tauri-plugin-clipboard-manager = "2"
reqwest = { version = "0.12", default-features = false, features = ["json", "multipart", "native-tls"] }
base64 = "0.22"
image = { version = "0.25", default-features = false, features = ["png", "jpeg", "webp", "gif"] }
futures = "0.3"

[profile.release]
codegen-units = 1
lto = true
opt-level = "s"
strip = true
